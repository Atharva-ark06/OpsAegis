name: OpsAegis Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect committed credentials and tokens
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$RUNNER_TEMP:/out" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            detect --source=/repo --redact --no-banner \
            --report-format=json --report-path=/out/gitleaks-report.json
          scan_status=$?
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "gitleaks-report.json"
          if report.exists():
              findings = json.loads(report.read_text(encoding="utf-8"))
              print(f"Gitleaks findings: {len(findings)}")
              for finding in findings:
                  print(
                      "Finding metadata only: "
                      f"rule={finding.get('RuleID', 'unknown')}; "
                      f"file={finding.get('File', 'unknown')}; "
                      f"line={finding.get('StartLine', 'unknown')}; "
                      f"commit={finding.get('Commit', 'unknown')}"
                  )
          else:
              print("Gitleaks did not produce a report file.")
          PY
          exit "$scan_status"

  dependency-audit:
    name: Backend and frontend dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit backend dependencies
        run: pip-audit --strict -r backend/requirements.txt
      - name: Audit Shannon bridge dependencies
        run: pip-audit --strict -r runner/shannon-bridge/requirements.txt

      - name: Set up Node.js for frontend audit
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve frontend dependencies without lifecycle scripts
        working-directory: frontend
        run: npm install --ignore-scripts --no-audit

      - name: Capture frontend npm audit report
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "npm-audit.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          counts = report.get("metadata", {}).get("vulnerabilities", {})
          print("Frontend npm audit severity counts:")
          for severity in ("critical", "high", "moderate", "low", "info"):
              print(f"  {severity}: {counts.get(severity, 0)}")
          for name, advisory in sorted(report.get("vulnerabilities", {}).items()):
              via = advisory.get("via", [])
              titles = [item.get("title", "unknown advisory") for item in via if isinstance(item, dict)]
              print(f"Package: {name}; severity: {advisory.get('severity', 'unknown')}; direct: {advisory.get('isDirect', False)}; fixAvailable: {advisory.get('fixAvailable', False)}; advisories: {', '.join(titles) or 'see attached JSON report'}")
          PY
          echo "npm audit exit code: $audit_status (reporting-only until the dependency baseline is remediated)"

      - name: Upload frontend npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
