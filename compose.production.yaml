name: opsaegis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsaegis}
      POSTGRES_USER: ${POSTGRES_USER:-opsaegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsaegis} -d ${POSTGRES_DB:-opsaegis}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  migrate:
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      OPS_AEGIS_ENV: production
      OPS_AEGIS_SECRET_KEY: ${OPS_AEGIS_SECRET_KEY:?Set OPS_AEGIS_SECRET_KEY in .env.production}
      OPS_AEGIS_ACCESS_TOKEN_MINUTES: ${OPS_AEGIS_ACCESS_TOKEN_MINUTES:-15}
      OPS_AEGIS_ALLOWED_HOSTS: ${OPS_AEGIS_ALLOWED_HOSTS:?Set OPS_AEGIS_ALLOWED_HOSTS in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]
    restart: "no"
    mem_limit: 512m
    cpus: 0.5

  backend:
    env_file: .env.production
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      OPS_AEGIS_ENV: production
      OPS_AEGIS_SECRET_KEY: ${OPS_AEGIS_SECRET_KEY:?Set OPS_AEGIS_SECRET_KEY in .env.production}
      OPS_AEGIS_ACCESS_TOKEN_MINUTES: ${OPS_AEGIS_ACCESS_TOKEN_MINUTES:-15}
      OPS_AEGIS_ALLOWED_HOSTS: ${OPS_AEGIS_ALLOWED_HOSTS:?Set OPS_AEGIS_ALLOWED_HOSTS in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)); raise SystemExit(0 if d.get('status') == 'ready' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  detection-worker:
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      OPS_AEGIS_ENV: production
      OPS_AEGIS_SECRET_KEY: ${OPS_AEGIS_SECRET_KEY:?Set OPS_AEGIS_SECRET_KEY in .env.production}
      OPS_AEGIS_ACCESS_TOKEN_MINUTES: ${OPS_AEGIS_ACCESS_TOKEN_MINUTES:-15}
      OPS_AEGIS_ALLOWED_HOSTS: ${OPS_AEGIS_ALLOWED_HOSTS:?Set OPS_AEGIS_ALLOWED_HOSTS in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  nuclei-worker:
    profiles: ["scanner"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    build:
      context: ./backend
      dockerfile: Dockerfile.nuclei-worker
    environment:
      OPS_AEGIS_ENV: production
      OPS_AEGIS_SECRET_KEY: ${OPS_AEGIS_SECRET_KEY:?Set OPS_AEGIS_SECRET_KEY in .env.production}
      OPS_AEGIS_ACCESS_TOKEN_MINUTES: ${OPS_AEGIS_ACCESS_TOKEN_MINUTES:-15}
      OPS_AEGIS_ALLOWED_HOSTS: ${OPS_AEGIS_ALLOWED_HOSTS:?Set OPS_AEGIS_ALLOWED_HOSTS in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
      NUCLEI_ENABLED: ${NUCLEI_ENABLED:-false}
      NUCLEI_WORKER_ENABLED: ${NUCLEI_WORKER_ENABLED:-false}
      NUCLEI_BINARY: /usr/local/bin/nuclei
      NUCLEI_TIMEOUT_SECONDS: ${NUCLEI_TIMEOUT_SECONDS:-600}
      NUCLEI_MAX_OUTPUT_BYTES: ${NUCLEI_MAX_OUTPUT_BYTES:-10485760}
      NUCLEI_RATE_LIMIT: ${NUCLEI_RATE_LIMIT:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, scanner-egress]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  frontend:
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

networks:
  edge:
  data:
    internal: true
  scanner-egress:

volumes:
  postgres_data:
  redis_data:
