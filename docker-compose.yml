services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsaegis}
      POSTGRES_USER: ${POSTGRES_USER:-opsaegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsaegis} -d ${POSTGRES_DB:-opsaegis}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      OPS_AEGIS_SECRET_KEY: ${OPS_AEGIS_SECRET_KEY:-development-only-change-this}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opsaegis:change-me@postgres:5432/opsaegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      EVIDENCE_STORAGE_PATH: /var/lib/opsaegis/evidence
    volumes:
      - evidence_data:/var/lib/opsaegis/evidence
      - ./deployment/certs:/run/opsaegis/certs:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
  detection-worker:
    build: ./backend
    environment:
      OPS_AEGIS_ENV: ${OPS_AEGIS_ENV:-development}
      OPS_AEGIS_SECRET_KEY: ${OPS_AEGIS_WORKER_SECRET_KEY:-development-only-change-this-worker-secret-key-not-for-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opsaegis:change-me@postgres:5432/opsaegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  collection-worker:
    build: ./backend
    environment:
      OPS_AEGIS_ENV: ${OPS_AEGIS_ENV:-development}
      OPS_AEGIS_SECRET_KEY: ${OPS_AEGIS_WORKER_SECRET_KEY:-development-only-change-this-worker-secret-key-not-for-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opsaegis:change-me@postgres:5432/opsaegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WAZUH_MANAGER_URL: ${WAZUH_MANAGER_URL:-}
      WAZUH_MANAGER_USERNAME: ${WAZUH_MANAGER_USERNAME:-}
      WAZUH_MANAGER_PASSWORD: ${WAZUH_MANAGER_PASSWORD:-}
      WAZUH_MANAGER_CA_CERT: ${WAZUH_MANAGER_CA_CERT:-}
      WAZUH_MANAGER_TIMEOUT_SECONDS: ${WAZUH_MANAGER_TIMEOUT_SECONDS:-10}
      WAZUH_MANAGER_MAX_AGENTS: ${WAZUH_MANAGER_MAX_AGENTS:-500}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      WAZUH_INDEXER_INDEX_PATTERN: ${WAZUH_INDEXER_INDEX_PATTERN:-wazuh-alerts-*}
      WAZUH_INDEXER_VERIFY_TLS: "${WAZUH_INDEXER_VERIFY_TLS:-true}"
      WAZUH_INDEXER_CA_CERT: ${WAZUH_INDEXER_CA_CERT:-}
      WAZUH_INDEXER_TIMEOUT_SECONDS: ${WAZUH_INDEXER_TIMEOUT_SECONDS:-10}
      WAZUH_INDEXER_MAX_RESULTS: ${WAZUH_INDEXER_MAX_RESULTS:-500}
    volumes:
      - ./deployment/certs:/run/opsaegis/certs:ro
    command: ["python", "-m", "app.collection_worker"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  evidence_data:
